allowBuilds:
  core-js: false
  simple-git-hooks: false
minimumReleaseAgeExclude:
  - '@rsbuild/*'
  - '@rsbuild/core'
  - '@rsbuild/plugin-*'
  - '@rslib/*'
  - '@rslint/*'
  - '@rspack/*'
  - '@rspress/*'
  - '@rstackjs/*'
  - '@rstest/*'
  - '@typescript/*'
  - 'rsbuild-plugin-*'
  - rstack
  - typescript
